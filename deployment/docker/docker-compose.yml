services:

  # ==========================================================
  # POLIS API
  # ==========================================================
  polis-api:
    image: polis:test
    container_name: polis-api

    ports:
      - "8000:8000"

    env_file:
      - .env.docker

    environment:
      POSTGRES_HOST: n8n-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: polis
      POSTGRES_USER: polis
      POSTGRES_PASSWORD: 1234
      DATABASE_URL: postgresql://polis:1234@n8n-postgres:5432/polis

      QDRANT_HOST: polis-qdrant
      QDRANT_PORT: 6333
      QDRANT_URL: http://polis-qdrant:6333
      VECTOR_STORE_URL: http://polis-qdrant:6333

      MINIO_HOST: polis-minio
      MINIO_PORT: 9000
      MINIO_CONSOLE_PORT: 9001
      MINIO_ENDPOINT: http://polis-minio:9000

    depends_on:
      - polis-qdrant
      - polis-minio

    restart: unless-stopped

    networks:
      - n8n_n8n-network


  # ==========================================================
  # POLIS SLACK LISTENER
  # ==========================================================
  polis-slack:
    image: polis:test
    container_name: polis-slack

    command:
      - python
      - /app/run_slack_listener.py

    healthcheck:
      disable: true

    env_file:
      - .env.docker

    environment:
      POSTGRES_HOST: n8n-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: polis
      POSTGRES_USER: polis
      POSTGRES_PASSWORD: 1234
      DATABASE_URL: postgresql://polis:1234@n8n-postgres:5432/polis

      QDRANT_HOST: polis-qdrant
      QDRANT_PORT: 6333
      QDRANT_URL: http://polis-qdrant:6333
      VECTOR_STORE_URL: http://polis-qdrant:6333

      MINIO_HOST: polis-minio
      MINIO_PORT: 9000
      MINIO_CONSOLE_PORT: 9001
      MINIO_ENDPOINT: http://polis-minio:9000

    depends_on:
      - polis-qdrant
      - polis-minio

    restart: unless-stopped

    networks:
      - n8n_n8n-network


  # ==========================================================
  # QDRANT
  # ==========================================================
  polis-qdrant:
    image: qdrant/qdrant:latest
    container_name: polis-qdrant

    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

    ports:
      - "6334:6333"
    volumes:
      - polis_qdrant_data:/qdrant/storage

    restart: unless-stopped

    networks:
      - n8n_n8n-network


  # ==========================================================
  # MINIO
  # ==========================================================
  polis-minio:
    image: minio/minio:latest
    container_name: polis-minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    ports:
      - "${MINIO_PORT}:9000"

    volumes:
      - polis_minio_data:/data

    restart: unless-stopped

    networks:
      - n8n_n8n-network


# ==========================================================
# Persistent storage
# ==========================================================
volumes:

  polis_qdrant_data:
    name: polis_qdrant_data

  polis_minio_data:
    name: polis_minio_data


# ==========================================================
# Existing n8n network
# ==========================================================
networks:

  n8n_n8n-network:
    external: true
