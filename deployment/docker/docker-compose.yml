services:
  # ==========================================================
  # PostgreSQL - Canonical Organizational Database
  # ==========================================================
  postgres:
    image: postgres:17-alpine
    container_name: polis-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - polis_network

  # ==========================================================
  # Qdrant - Vector Database
  # ==========================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: polis-qdrant

    ports:
      - "${QDRANT_PORT}:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY}

    restart: unless-stopped

    networks:
      - polis_network

  # ==========================================================
  # MinIO - Object Storage
  # ==========================================================
  minio:
    image: minio/minio:latest
    container_name: polis-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

    volumes:
      - minio_data:/data

    restart: unless-stopped

    networks:
      - polis_network

  # ==========================================================
  # Adminer - PostgreSQL Management UI
  # ==========================================================
  adminer:
    image: adminer:latest
    container_name: polis-adminer

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    restart: unless-stopped

    networks:
      - polis_network

# ==========================================================
# Volumes
# ==========================================================
volumes:
  postgres_data:
  qdrant_data:
  minio_data:

# ==========================================================
# Network
# ==========================================================
networks:
  polis_network:
    name: polis_network
    driver: bridge